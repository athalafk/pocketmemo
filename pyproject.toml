[project]
name = "pocketmemo"
version = "1.0.0"
description = "Your personal AI assistant on Telegram — notes, memories, files, and reminders. Self-hosted."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Athala Farrastya Kamil" }]
keywords = ["telegram", "bot", "assistant", "ai", "gemini", "self-hosted", "notes", "reminders"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
